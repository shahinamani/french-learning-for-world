<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Free French practice with spaced repetition. No account, works offline.">
<meta name="theme-color" content="#38407f">
<title>French Learning for World</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNiAxNiI+PHJlY3Qgd2lkdGg9IjE2IiBoZWlnaHQ9IjE2IiByeD0iMyIgZmlsbD0iIzM4NDA3ZiIvPjwvc3ZnPg==">
<!-- Loaded plainly, not with the media="print" onload="this.media='all'"
     trick. That trick is an INLINE EVENT HANDLER, and a Content-Security-Policy
     without 'unsafe-inline' blocks it: the stylesheet would stay media="print"
     for every visitor with JavaScript, and the designed faces would never load
     at all. The noscript fallback hid that, because it only fires when JS is
     off — the one case where the handler was never going to run anyway.
     The cost of loading it plainly is small: fonts.css is 3.3 KB and the faces
     are font-display: optional, so first paint still does not wait on them. -->
<link rel="stylesheet" href="./fonts/fonts.css">
</head>
<body>
<div id="root">
  <div style="min-height:100%;display:flex;flex-direction:column;background:#f2f4f7;color:#14171f;font:16px/1.55 system-ui,sans-serif">
    <div style="height:3px;background:#e9ecf1"></div>
    <header style="height:52px;display:flex;align-items:center;gap:9px;padding:0 16px;background:#fff;border-bottom:1px solid #dfe3ea">
      <span style="background:#38407f;color:#fff;font:600 11px/1 system-ui;padding:6px 7px;border-radius:6px">Fr</span>
      <span style="font-weight:600;font-size:14px">French Learning for World</span>
    </header>
    <div style="flex:1;padding:16px;max-width:78rem;margin:0 auto;width:100%">
      <div style="background:#fff;border:1px solid #dfe3ea;border-radius:10px;padding:24px;max-width:34rem">
        <div style="font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:#5c6470;font-weight:600">Today</div>
        <div style="height:28px;margin:12px 0;background:#e9ecf1;border-radius:6px;width:60%"></div>
        <div style="height:44px;background:#e9ecf1;border-radius:10px"></div>
      </div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
